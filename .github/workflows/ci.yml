name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests example

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -m "not integration" --cov=django_event_bus --cov-report=term-missing

  test-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # KRaft mono-noeud pret a l'emploi avec la config par defaut de
      # l'image (pas de Zookeeper a orchestrer en plus).
      #
      # Single-node KRaft, ready to use with the image's default config
      # (no Zookeeper to orchestrate alongside it).
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      # apache/kafka n'expose pas de healthcheck simple via les options
      # Docker des services GitHub Actions: on attend que le port TCP
      # reponde avant de lancer les tests, pour eviter que
      # test_kafka_broker.py ne soit SKIPpe silencieusement faute de
      # broker pret a temps.
      #
      # apache/kafka doesn't expose an easy healthcheck via GitHub
      # Actions service Docker options: wait for the TCP port to answer
      # before running the tests, so test_kafka_broker.py doesn't
      # silently SKIP for lack of a broker ready in time.
      - name: Wait for Kafka
        run: timeout 60 bash -c 'until echo > /dev/tcp/localhost/9092; do sleep 1; done'
      - run: uv run pytest -m integration

  # Scan des dépendances connues vulnérables (advisories PyPI/OSV). Non
  # bloquant pour `build` volontairement: une CVE tout juste publiée sur
  # une dépendance transitive ne doit pas empêcher un correctif urgent
  # d'être publié faute de fix amont disponible — voir SECURITY.md.
  #
  # Scans dependencies against known vulnerability advisories
  # (PyPI/OSV). Deliberately not blocking `build`: a CVE just disclosed
  # on a transitive dependency should not prevent an urgent fix from
  # being published for lack of an upstream patch yet — see SECURITY.md.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --with pip-audit pip-audit

  test-django-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Run tests against Django ${{ matrix.django-version }}
        run: uv run --with "django==${{ matrix.django-version }}.*" pytest -m "not integration"

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-integration, test-django-versions]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
