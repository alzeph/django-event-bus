name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rattrape les nouveaux patterns de requêtes CodeQL même sans push
    # (le scan sur push/PR seul ne couvrirait pas les règles ajoutées
    # après le dernier commit sur une branche inactive).
    #
    # Catches new CodeQL query patterns even without a push (a push/PR-only
    # scan would miss rules added after the last commit on an inactive
    # branch).
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3
