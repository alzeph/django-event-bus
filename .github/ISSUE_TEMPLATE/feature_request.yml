name: Feature request
description: Propose an improvement for django-event-bus
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need isn't covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How do you picture the solution?
    validations:
      required: true
