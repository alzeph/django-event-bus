[project]
name = "django-event-bus"
dynamic = ["version"]
description = "Inter-service event bus and remote data access for Django microservice architectures — pluggable brokers (Redis, more to come), RemoteForeignKey over HTTP/gRPC, and declarative resource exposure."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Cédric Hervé Youan", email = "hervecedricyouan@gmail.com" }]
keywords = [
    "django",
    "microservices",
    "event-bus",
    "events",
    "redis",
    "grpc",
    "distributed",
    "signals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2",
    "redis>=5.0",
    "requests>=2.31",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.urls]
Repository = "https://github.com/alzeph/django-event-bus"
Changelog = "https://github.com/alzeph/django-event-bus/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "requests-mock>=1.12",
    "grpcio-tools>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/django_event_bus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/django_event_bus"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["**/migrations/*", "**/*_pb2.py", "**/*_pb2.pyi", "**/*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "BLE", "A", "D"]
ignore = [
    "D203", # incompatible avec D211 (ligne vide avant docstring de classe)
    "D213", # incompatible avec D212 (résumé sur la première ligne)
    "D401", # heuristique anglaise (mode impératif) inadaptée à des résumés en français
    "RUF012", # classes Meta (ResourceSerializer) jamais instanciées: pas de risque de mutation partagée
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"example/**" = ["D"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["_pb2\\.py$", "_pb2_grpc\\.py$"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
markers = [
    "integration: needs a running Redis instance (see example/docker-compose.yml)",
]

[tool.coverage.run]
source = ["django_event_bus"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]
