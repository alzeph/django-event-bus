[project]
name = "django-event-bus"
version = "0.1.0"
description = "Bus d'événements inter-services pour architectures microservices Django, avec brokers interchangeables (Redis, puis Kafka)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=4.2",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_event_bus"]

[tool.ruff]
extend-exclude = ["**/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
markers = [
    "integration: needs a running Redis instance (see example/docker-compose.yml)",
]
